<!doctype html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Insulsómetro 📻</title>
		<style>
			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			:root {
				--thermo-width: clamp(44px, 11vw, 72px);
				--thermo-height: clamp(250px, 40vh, 360px);
				--tube-width: clamp(18px, 4vw, 30px);
				--tube-height: calc(var(--thermo-height) - 40px);
				--bulb-size: clamp(38px, 8vw, 52px);
			}

			body {
				height: 100%;
				min-height: 100vh;
				background: #10172f;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				font-family: 'Segoe UI', Arial, sans-serif;
				color: #fff;
				padding: 0;
			}

			h1 {
				font-size: 2.4rem;
				letter-spacing: 2px;
				text-transform: uppercase;
				margin-bottom: 4px;
				text-shadow: 0 0 20px rgba(255, 80, 80, 0.6);
			}

			.subtitle {
				font-size: 0.95rem;
				color: #aac;
				margin-bottom: 12px;
				text-align: center;
			}

			.main-card {
				background: rgba(17, 24, 50, 0.98);
				border: none;
				border-radius: 0;
				padding: 28px 22px;
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 26px;
				min-height: 100vh;
				width: 100%;
				max-width: none;
				box-shadow: none;
			}
			/* ── Thermometer ── */
			.thermo-wrap {
				display: flex;
				align-items: flex-end;
				gap: 24px;
				width: 100%;
				justify-content: center;
			}

			.thermo-labels {
				display: flex;
				flex-direction: column;
				justify-content: space-between;
				height: var(--tube-height);
				padding-bottom: 34px;
				text-align: right;
			}

			.thermo-labels span {
				font-size: 0.75rem;
				color: #99aacc;
				line-height: 1;
			}

			.thermometer {
				position: relative;
				width: clamp(48px, 16vw, 96px);
				height: var(--thermo-height);
				cursor: pointer;
				user-select: none;
			}

			/* tube background */
			.tube-bg {
				position: absolute;
				left: 50%;
				transform: translateX(-50%);
				top: 0;
				width: var(--tube-width);
				height: var(--tube-height);
				background: rgba(255, 255, 255, 0.08);
				border: 2px solid rgba(255, 255, 255, 0.2);
				border-radius: 13px 13px 0 0;
				overflow: hidden;
			}

			/* mercury fill */
			.mercury {
				position: absolute;
				bottom: 0;
				left: 0;
				right: 0;
				background: linear-gradient(180deg, #ff6b6b, #ff2222);
				transition: height 0.25s cubic-bezier(0.4, 0, 0.2, 1);
				border-radius: 10px 10px 0 0;
			}

			/* tick marks */
			.ticks {
				position: absolute;
				left: 50%;
				transform: translateX(-50%);
				top: 0;
				width: var(--tube-width);
				height: var(--tube-height);
				pointer-events: none;
			}

			.tick {
				position: absolute;
				right: -10px;
				width: 8px;
				height: 1px;
				background: rgba(255, 255, 255, 0.3);
			}

			.tick.major {
				right: -14px;
				width: 12px;
				background: rgba(255, 255, 255, 0.6);
			}

			/* bulb */
			.bulb {
				position: absolute;
				bottom: 0;
				left: 50%;
				transform: translateX(-50%);
				width: var(--bulb-size);
				height: var(--bulb-size);
				border-radius: 50%;
				background: radial-gradient(
					circle at 35% 35%,
					#ff7777,
					#cc0000
				);
				border: 2px solid rgba(255, 255, 255, 0.25);
				box-shadow:
					0 0 18px rgba(255, 60, 60, 0.7),
					inset 0 0 10px rgba(0, 0, 0, 0.3);
				transition: box-shadow 0.25s;
			}

			.bulb.hot {
				box-shadow:
					0 0 30px rgba(255, 60, 60, 0.95),
					inset 0 0 10px rgba(0, 0, 0, 0.3);
			}

			/* drag handle overlay */
			.drag-zone {
				position: absolute;
				left: 50%;
				transform: translateX(-50%);
				top: 0;
				width: var(--tube-width);
				height: var(--tube-height);
				cursor: ns-resize;
				z-index: 10;
			}

			/* ── Score display ── */
			.score-display {
				text-align: center;
			}

			.score-number {
				font-size: 4.5rem;
				font-weight: 900;
				line-height: 1;
				background: linear-gradient(135deg, #ff6b6b, #ffcc00);
				-webkit-background-clip: text;
				-webkit-text-fill-color: transparent;
				background-clip: text;
				transition: all 0.2s;
			}

			.score-label {
				font-size: 0.8rem;
				color: #99aacc;
				margin-top: 4px;
				letter-spacing: 1px;
			}

			/* ── Input row ── */
			.input-row {
				display: flex;
				align-items: center;
				gap: 10px;
				width: 100%;
			}

			.input-row input[type='range'] {
				flex: 1;
				appearance: none;
				-webkit-appearance: none;
				height: 6px;
				background: rgba(255, 255, 255, 0.15);
				border-radius: 3px;
				outline: none;
				cursor: pointer;
			}

			.input-row input[type='range']::-webkit-slider-thumb {
				-webkit-appearance: none;
				width: 22px;
				height: 22px;
				border-radius: 50%;
				background: linear-gradient(135deg, #ff6b6b, #cc0000);
				border: 2px solid #fff;
				cursor: pointer;
				box-shadow: 0 0 8px rgba(255, 60, 60, 0.6);
			}

			.input-row input[type='number'] {
				width: 70px;
				padding: 6px 8px;
				border: 1px solid rgba(255, 255, 255, 0.2);
				border-radius: 10px;
				background: rgba(255, 255, 255, 0.08);
				color: #fff;
				font-size: 1rem;
				text-align: center;
				outline: none;
			}

			.input-row input[type='number']:focus {
				border-color: #ff6b6b;
			}

			/* ── Submit button ── */
			.btn-submit {
				width: 100%;
				padding: 14px;
				font-size: 1.1rem;
				font-weight: 700;
				letter-spacing: 1px;
				border: none;
				border-radius: 14px;
				background: linear-gradient(135deg, #ff4444, #cc0000);
				color: #fff;
				cursor: pointer;
				transition:
					transform 0.15s,
					box-shadow 0.15s;
				box-shadow: 0 4px 20px rgba(255, 60, 60, 0.4);
			}

			.btn-submit:hover {
				transform: translateY(-2px);
				box-shadow: 0 8px 28px rgba(255, 60, 60, 0.6);
			}

			.btn-submit:active {
				transform: translateY(0);
			}

			/* ── Results panel ── */
			.results {
				width: 100%;
				border-top: 1px solid rgba(255, 255, 255, 0.1);
				padding-top: 20px;
			}

			.results h3 {
				font-size: 0.85rem;
				letter-spacing: 1px;
				color: #99aacc;
				text-transform: uppercase;
				margin-bottom: 12px;
			}

			.stats-row {
				display: grid;
				grid-template-columns: repeat(3, 1fr);
				gap: 10px;
				margin-bottom: 16px;
			}

			.stat-box {
				background: rgba(255, 255, 255, 0.06);
				border-radius: 12px;
				padding: 10px 8px;
				text-align: center;
			}

			.stat-box .val {
				font-size: 1.5rem;
				font-weight: 800;
				color: #ff9999;
			}

			.stat-box .lbl {
				font-size: 0.68rem;
				color: #99aacc;
				margin-top: 2px;
			}

			.vote-list {
				max-height: 120px;
				overflow-y: auto;
				display: flex;
				flex-direction: column;
				gap: 6px;
				padding-right: 4px;
			}

			.vote-list::-webkit-scrollbar {
				width: 4px;
			}
			.vote-list::-webkit-scrollbar-thumb {
				background: rgba(255, 100, 100, 0.4);
				border-radius: 2px;
			}

			.vote-item {
				display: flex;
				justify-content: space-between;
				align-items: center;
				background: rgba(255, 255, 255, 0.05);
				border-radius: 8px;
				padding: 6px 12px;
				font-size: 0.85rem;
				animation: fadeIn 0.3s ease;
			}

			@keyframes fadeIn {
				from {
					opacity: 0;
					transform: translateY(-6px);
				}
				to {
					opacity: 1;
					transform: translateY(0);
				}
			}

			.vote-item .v-score {
				font-weight: 700;
				color: #ff9999;
			}

			.vote-item .v-time {
				color: #667;
				font-size: 0.72rem;
			}

			.empty-msg {
				font-size: 0.85rem;
				color: #556;
				text-align: center;
				padding: 12px 0;
			}

			.toast {
				position: fixed;
				bottom: 30px;
				left: 50%;
				transform: translateX(-50%) translateY(80px);
				background: rgba(255, 80, 80, 0.92);
				color: #fff;
				padding: 12px 28px;
				border-radius: 50px;
				font-weight: 600;
				font-size: 0.95rem;
				box-shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
				transition:
					transform 0.35s cubic-bezier(0.4, 0, 0.2, 1),
					opacity 0.35s;
				opacity: 0;
				pointer-events: none;
				white-space: nowrap;
				z-index: 100;
			}

			.toast.show {
				transform: translateX(-50%) translateY(0);
				opacity: 1;
			}

			@media (max-width: 640px) {
				body {
					padding: 12px;
					justify-content: flex-start;
				}

				.main-card {
					padding: 22px 18px;
					gap: 20px;
				}

				.thermo-wrap {
					flex-direction: column;
					align-items: center;
					gap: 16px;
				}

				.score-number {
					font-size: 3.2rem;
				}

				.stats-row {
					grid-template-columns: repeat(2, minmax(0, 1fr));
				}

				.vote-list {
					max-height: 160px;
				}
			}
		</style>
	</head>
	<body>
		<div class="main-card">
			<h1>📻 Insulsómetro</h1>
			<p class="subtitle">
				¿Qué tan insulso es el comunicador de hoy? ¡Vota!
			</p>
			<!-- Thermometer + score -->
			<div
				style="
					display: flex;
					align-items: center;
					gap: 30px;
					width: 100%;
					justify-content: center;
				"
			>
				<!-- Thermometer -->
				<div class="thermo-wrap">
					<div class="thermo-labels" id="tickLabels"></div>
					<div class="thermometer" id="thermometer">
						<div class="tube-bg">
							<div class="mercury" id="mercury"></div>
						</div>
						<div class="ticks" id="ticksContainer"></div>
						<div class="bulb" id="bulb"></div>
						<div class="drag-zone" id="dragZone"></div>
					</div>
				</div>

				<!-- Score display -->
				<div class="score-display">
					<div class="score-number" id="scoreNumber">5.0</div>
					<div class="score-label">/ 10</div>
				</div>
			</div>

			<!-- Slider + number input -->
			<div class="input-row">
				<input
					type="range"
					id="slider"
					min="1"
					max="10"
					step="0.1"
					value="5"
				/>
				<input
					type="number"
					id="numInput"
					min="1"
					max="10"
					step="0.1"
					value="5"
				/>
			</div>

			<!-- Submit -->
			<button class="btn-submit" id="btnSubmit">
				📨 Registrar mi voto
			</button>

			<!-- Results -->
			<div class="results" id="results">
				<h3>📊 Resultados</h3>
				<div class="stats-row" id="statsRow">
					<div class="stat-box">
						<div class="val" id="statAvg">—</div>
						<div class="lbl">Promedio</div>
					</div>
					<div class="stat-box">
						<div class="val" id="statVotes">0</div>
						<div class="lbl">Votos</div>
					</div>
					<div class="stat-box">
						<div class="val" id="statMax">—</div>
						<div class="lbl">Máximo</div>
					</div>
				</div>
				<div class="vote-list" id="voteList">
					<div class="empty-msg">
						Aún no hay votos. ¡Sé el primero!
					</div>
				</div>
			</div>
		</div>
		<div class="toast" id="toast"></div>

		<script>
			const tubeBg = document.querySelector('.tube-bg');
			let TUBE_H = tubeBg ? tubeBg.clientHeight : 300;

			const slider = document.getElementById('slider');
			const numInput = document.getElementById('numInput');
			const mercury = document.getElementById('mercury');
			const bulb = document.getElementById('bulb');
			const scoreNum = document.getElementById('scoreNumber');
			const dragZone = document.getElementById('dragZone');
			const btnSubmit = document.getElementById('btnSubmit');
			const voteList = document.getElementById('voteList');
			const statAvg = document.getElementById('statAvg');
			const statVotes = document.getElementById('statVotes');
			const statMax = document.getElementById('statMax');
			const toast = document.getElementById('toast');

			let votes = [];
			let currentVal = 5.0;

			// Build ticks
			const ticksContainer = document.getElementById('ticksContainer');
			const tickLabels = document.getElementById('tickLabels');
			const labelSpans = [];

			for (let i = 10; i >= 1; i--) {
				const pct = (i - 1) / 9;
				const y = (1 - pct) * 100;

				const tick = document.createElement('div');
				tick.className = 'tick major';
				tick.style.top = y + '%';
				ticksContainer.appendChild(tick);

				// minor ticks between major ones
				if (i > 1) {
					for (let j = 1; j <= 9; j++) {
						const py = y + (j / 9) * (100 / 9);
						const mt = document.createElement('div');
						mt.className = 'tick';
						mt.style.top = py + '%';
						ticksContainer.appendChild(mt);
					}
				}

				const sp = document.createElement('span');
				sp.textContent = i;
				labelSpans.push(sp);
				tickLabels.appendChild(sp);
			}

			function valToFill(v) {
				return ((v - 1) / 9) * TUBE_H;
			}

			function updateUI(v) {
				v = Math.round(v * 10) / 10;
				v = Math.max(1, Math.min(10, v));
				currentVal = v;

				const fill = valToFill(v);
				mercury.style.height = fill + 'px';

				const isHot = v >= 7;
				bulb.classList.toggle('hot', isHot);

				scoreNum.textContent = v.toFixed(1);

				// color gradient on mercury
				const pct = (v - 1) / 9;
				const r = Math.round(80 + 175 * pct);
				const g = Math.round(150 - 110 * pct);
				mercury.style.background = `linear-gradient(180deg, rgb(${r},${g},60), rgb(${r - 20},${Math.max(g - 20, 0)},40))`;

				// sync controls without firing events
				slider.value = v;
				numInput.value = v.toFixed(1);
			}

			function updateTubeHeight() {
				if (tubeBg) {
					TUBE_H = tubeBg.getBoundingClientRect().height;
				}
			}

			window.addEventListener('resize', () => {
				updateTubeHeight();
				updateUI(currentVal);
			});

			// Slider
			slider.addEventListener('input', () =>
				updateUI(parseFloat(slider.value)),
			);

			// Number input
			numInput.addEventListener('input', () => {
				const v = parseFloat(numInput.value);
				if (!isNaN(v)) updateUI(v);
			});
			numInput.addEventListener('blur', () => {
				let v = parseFloat(numInput.value);
				if (isNaN(v)) v = currentVal;
				updateUI(v);
			});

			// Drag on thermometer tube
			let dragging = false;

			function yToVal(clientY) {
				const rect = dragZone.getBoundingClientRect();
				const relY = clientY - rect.top;
				const pct = 1 - Math.max(0, Math.min(TUBE_H, relY)) / TUBE_H;
				return 1 + pct * 9;
			}

			dragZone.addEventListener('mousedown', (e) => {
				dragging = true;
				updateUI(yToVal(e.clientY));
			});
			window.addEventListener('mousemove', (e) => {
				if (dragging) updateUI(yToVal(e.clientY));
			});
			window.addEventListener('mouseup', () => {
				dragging = false;
			});

			dragZone.addEventListener(
				'touchstart',
				(e) => {
					dragging = true;
					updateUI(yToVal(e.touches[0].clientY));
				},
				{ passive: true },
			);
			window.addEventListener(
				'touchmove',
				(e) => {
					if (dragging) updateUI(yToVal(e.touches[0].clientY));
				},
				{ passive: true },
			);
			window.addEventListener('touchend', () => {
				dragging = false;
			});

			// Click on tube
			dragZone.addEventListener('click', (e) =>
				updateUI(yToVal(e.clientY)),
			);

			// Submit vote
			btnSubmit.addEventListener('click', () => {
				const v = currentVal;
				const now = new Date();
				const time = now.toLocaleTimeString('es', {
					hour: '2-digit',
					minute: '2-digit',
				});
				votes.unshift({ score: v, time });

				updateStats();
				renderVotes();
				showToast(`✅ Voto registrado: ${v.toFixed(1)}`);

				// pulse animation
				btnSubmit.textContent = '✔ ¡Registrado!';
				setTimeout(() => {
					btnSubmit.textContent = '📨 Registrar mi voto';
				}, 1500);
			});

			function updateStats() {
				const total = votes.length;
				statVotes.textContent = total;
				if (total === 0) {
					statAvg.textContent = '—';
					statMax.textContent = '—';
					return;
				}
				const avg = votes.reduce((s, v) => s + v.score, 0) / total;
				const max = Math.max(...votes.map((v) => v.score));
				statAvg.textContent = avg.toFixed(1);
				statMax.textContent = max.toFixed(1);
			}

			function renderVotes() {
				if (votes.length === 0) {
					voteList.innerHTML =
						'<div class="empty-msg">Aún no hay votos. ¡Sé el primero!</div>';
					return;
				}
				voteList.innerHTML = votes
					.map(
						(v, i) => `
      <div class="vote-item">
        <span>#${votes.length - i} &nbsp; <span class="v-score">${v.score.toFixed(1)}</span></span>
        <span class="v-time">${v.time}</span>
      </div>`,
					)
					.join('');
			}

			function showToast(msg) {
				toast.textContent = msg;
				toast.classList.add('show');
				setTimeout(() => toast.classList.remove('show'), 2400);
			}

			// Init
			updateUI(5.0);
		</script>
	</body>
</html>
